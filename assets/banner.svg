<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Vibrant glow gradients -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a78bfa" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
        letter-spacing: 0.8px;
      }
      .eq-bar {
        transform-origin: bottom;
        animation: pulse 1.8s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scaleY(0.25); }
        50% { transform: scaleY(1.0); }
        100% { transform: scaleY(0.4); }
      }
      .wave-anim {
        animation: waveFlow 10s linear infinite alternate;
      }
      @keyframes waveFlow {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-40px); }
      }
      .orb-float {
        animation: orbMove 8s ease-in-out infinite alternate;
      }
      @keyframes orbMove {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-15px) scale(1.08); }
      }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Glowing Orbs (Dynamic background elements) -->
  <g class="orb-float">
    <circle cx="240" cy="120" r="220" fill="url(#glowPurple)" />
    <circle cx="980" cy="180" r="240" fill="url(#glowCyan)" />
    <circle cx="600" cy="340" r="200" fill="url(#glowPink)" />
  </g>

  <!-- Modern Grid pattern overlay -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.8">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Soundwave Lines in Background -->
  <g class="wave-anim" opacity="0.45" fill="none" stroke="url(#waveGrad)" stroke-width="2.5">
    <path d="M-50,330 C120,270 250,380 420,320 C590,260 720,370 900,310 C1080,250 1190,360 1300,310" />
    <path d="M-50,345 C150,385 280,290 460,345 C640,400 770,290 950,345 C1130,400 1220,295 1300,345" opacity="0.6" stroke-dasharray="4,6" />
    <path d="M-50,315 C100,230 300,360 500,295 C700,230 880,380 1100,285 C1200,240 1260,330 1320,300" opacity="0.5" stroke="#38bdf8" />
  </g>

  <!-- Dynamic Spectrum Equalizer Bars (Positioned bottom background) -->
  <g opacity="0.38" fill="url(#titleGrad)">
    <!-- Low frequencies -->
    <rect class="eq-bar" x="70" y="310" width="8" height="60" rx="4" style="animation-duration: 1.3s; animation-delay: 0.1s;" />
    <rect class="eq-bar" x="84" y="290" width="8" height="80" rx="4" style="animation-duration: 1.6s; animation-delay: 0.3s;" />
    <rect class="eq-bar" x="98" y="270" width="8" height="100" rx="4" style="animation-duration: 1.1s; animation-delay: 0.5s;" />
    <rect class="eq-bar" x="112" y="285" width="8" height="85" rx="4" style="animation-duration: 1.8s; animation-delay: 0.2s;" />
    <rect class="eq-bar" x="126" y="305" width="8" height="65" rx="4" style="animation-duration: 1.4s; animation-delay: 0.4s;" />
    <!-- High frequencies right -->
    <rect class="eq-bar" x="1060" y="300" width="8" height="70" rx="4" style="animation-duration: 1.2s; animation-delay: 0.2s;" />
    <rect class="eq-bar" x="1074" y="275" width="8" height="95" rx="4" style="animation-duration: 1.7s; animation-delay: 0.6s;" />
    <rect class="eq-bar" x="1088" y="260" width="8" height="110" rx="4" style="animation-duration: 1.4s; animation-delay: 0.1s;" />
    <rect class="eq-bar" x="1102" y="280" width="8" height="90" rx="4" style="animation-duration: 1.9s; animation-delay: 0.4s;" />
    <rect class="eq-bar" x="1116" y="315" width="8" height="55" rx="4" style="animation-duration: 1.1s; animation-delay: 0.3s;" />
  </g>

  <!-- Foreground Content (Clear, crisp, unhidden) -->
  <!-- Top Badge / Category Pill -->
  <g transform="translate(60, 48)">
    <rect width="270" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" class="tag-text" fill="#a5b4fc">CURATED AUDIO TECH DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="132" class="title-text" fill="url(#titleGrad)">Awesome Audio DSP &amp; Real-Time Sound Synthesis</text>

  <!-- Subtitle -->
  <text x="60" y="174" class="subtitle-text">Curated ecosystem of Web DAWs, C++ DSP Frameworks, Modular Engines &amp; Production SaaS</text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(60, 218)">
    <!-- Pill 1: DAWs -->
    <g transform="translate(0, 0)">
      <rect width="170" height="38" rx="10" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="18" y="24" class="tag-text" fill="#38bdf8">🎛️ Web &amp; Desktop DAWs</text>
    </g>
    <!-- Pill 2: DSP Engines -->
    <g transform="translate(186, 0)">
      <rect width="180" height="38" rx="10" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
      <text x="18" y="24" class="tag-text" fill="#c084fc">⚡ Real-Time DSP Engines</text>
    </g>
    <!-- Pill 3: Modular Synths -->
    <g transform="translate(382, 0)">
      <rect width="180" height="38" rx="10" fill="url(#pillGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />
      <text x="18" y="24" class="tag-text" fill="#f472b6">🎹 Modular Synthesizers</text>
    </g>
    <!-- Pill 4: Plugin Frameworks -->
    <g transform="translate(578, 0)">
      <rect width="174" height="38" rx="10" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <text x="18" y="24" class="tag-text" fill="#34d399">📦 VST3 / CLAP / WASM</text>
    </g>
    <!-- Pill 5: AI & Mastering -->
    <g transform="translate(768, 0)">
      <rect width="168" height="38" rx="10" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" />
      <text x="18" y="24" class="tag-text" fill="#fbbf24">🤖 AI Audio &amp; Mastering</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="60" y="380" width="1080" height="2" fill="url(#titleGrad)" opacity="0.4" rx="1" />
</svg>
